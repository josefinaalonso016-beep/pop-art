<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Pop Art</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor-web">


        <header class="header">
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="Logo Pop Art">
            </a>

            <nav class="menu">
                <a href="index.html">inicio</a>
                <a href="historia.html">historia</a>
                <a href="arte-y-tecnicas.html">arte y técnicas</a>
                <a href="referentes.html">referentes</a>
                <a href="galeria.html">galería</a>
                <a href="contacto.html" class="activo">contacto</a>
            </nav>

            <button class="buscar" aria-label="Buscar" id="btnAbrirModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </header>


        <main>
            <section class="pagina pagina-contacto">

                <div class="contenedor-contacto-central">

                    <div class="banner-contacto">
                        <h2 class="subtitulo-pop">CONTACTO</h2>
                    </div>

                    <div class="tarjeta-formulario-wrapper">

                        <div class="pop-decoracion destello-pop"></div>
                        <div class="pop-sticker sticker-pow">POW!</div>
                        <div class="pop-sticker sticker-boom">BOOM!</div>

                        <div class="tarjeta-formulario">
                            <form id="formContacto" novalidate>

                                <div class="campo-form">
                                    <input type="text" id="nombreContacto" placeholder="Tu nombre">
                                </div>

                                <div class="campo-form">
                                    <input type="email" id="emailContacto" placeholder="Tu email">
                                </div>

                                <div class="campo-form">
                                    <textarea id="mensajeContacto" rows="5" placeholder="Tu mensaje..."></textarea>
                                </div>

                                <button type="submit" class="btn-enviar-pop">
                                    <span>ENVIAR</span>
                                </button>

                                <!-- MOVIDO ACÁ: Los mensajes de error o éxito aparecerán debajo del botón -->
                                <div id="mensajeEstado" class="mensaje-estado"></div>

                            </form>
                        </div>
                    </div>

                </div>

    </div>

    </section>
    </main>


    <footer class="footer-pop">
        <div class="footer-contenido">
            <div class="footer-marca">
                <span class="logo-texto">POP ART</span>
                <p>El arte de transformar lo cotidiano en icono.</p>
            </div>
        </div>
        <div class="footer-copy">
            <p>© 2026 Pop Art</p>
        </div>
    </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
