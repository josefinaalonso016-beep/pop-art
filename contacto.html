<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Pop Art</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor-web">

        <header class="header">
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="Logo Pop Art">
            </a>

            <nav class="menu">
                <a href="index.html">INICIO</a>
                <a href="historia.html">HISTORIA</a>
                <a href="arte-y-tecnicas.html">ARTE Y TÉCNICAS</a>
                <a href="artistas.html">ARTISTAS</a>
                <a href="galeria.html">GALERÍA</a>
                <a href="contacto.html" class="activo">CONTACTO</a>
            </nav>


        </header>

        <main>
            <section class="pagina pagina-contacto">

                <div class="contacto-layout">


                    <div class="contenedor-contacto-central">

                        <div class="banner-contacto">
                            <h2 class="subtitulo-pop">CONTACTO</h2>
                        </div>

                        <div class="tarjeta-formulario-wrapper">

                            <div class="pop-decoracion destello-pop"></div>
                            <div class="pop-sticker sticker-pow">POW!</div>
                            <div class="pop-sticker sticker-boom">BOOM!</div>

                            <div class="tarjeta-formulario">

                                <form id="formContacto" action="enviar.php" method="POST">

                                    <div class="campo-form">
                                        <input type="text" id="nombreContacto" name="nombre" placeholder="Tu nombre"
                                            required>
                                    </div>

                                    <div class="campo-form">
                                        <input type="email" id="emailContacto" name="email" placeholder="Tu email"
                                            required>
                                    </div>

                                    <div class="campo-form">
                                        <textarea id="mensajeContacto" name="mensaje" rows="5"
                                            placeholder="Tu mensaje..." required></textarea>
                                    </div>

                                    <button type="submit" class="btn-enviar-pop">
                                        <span>ENVIAR</span>
                                    </button>

                                    <div id="mensajeEstado" class="mensaje-estado"></div>

                                </form>
                            </div>
                        </div>

                    </div>


                    <div class="contacto-fotos">
                        <div class="foto-contacto foto-contacto-1">
                            <img src="img/contacto-1.jpg" alt="Obra Pop Art">
                        </div>
                        <div class="foto-contacto foto-contacto-2">
                            <img src="img/contacto-2.jpg" alt="Obra Pop Art">
                        </div>
                    </div>

                </div>

            </section>
        </main>

        <footer class="footer-pop">
            <div class="footer-contenido">
                <div class="footer-marca">
                    <span class="logo-texto">POP ART</span>
                    <p>El arte de transformar lo cotidiano en icono.</p>
                </div>
            </div>
            <div class="footer-copy">
                <p>© 2026 Pop Art</p>
            </div>
        </footer>

    </div>
    <script>
        const parametros = new URLSearchParams(window.location.search);
        const estado = parametros.get("estado");
        const mensaje = document.getElementById("mensajeEstado");

        if (estado && mensaje) {

            if (estado === "exito") {
                mensaje.textContent = "¡Tu mensaje se envió correctamente!";
                mensaje.className = "mensaje-estado exito";
            }

            else if (estado === "email_invalido") {
                mensaje.textContent = "El correo electrónico no es válido. Revisalo.";
                mensaje.className = "mensaje-estado error";
            }

            else if (estado === "faltan_datos") {
                mensaje.textContent = "Completá todos los campos.";
                mensaje.className = "mensaje-estado error";
            }

            else if (estado === "error") {
                mensaje.textContent = "Hubo un problema al enviar el mensaje.";
                mensaje.className = "mensaje-estado error";
            }

            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>


</body>

</html>
